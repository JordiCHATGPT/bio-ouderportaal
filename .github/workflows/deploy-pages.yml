name: Publish parent portal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bio-parent-portal-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload portal only
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@v4
